<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test DOR UT2</title>
<style>
:root{
  --bg:#f3f6f6;--card:#ffffff;--ink:#16211f;--mute:#5d6b69;--line:#d9e2e1;
  --acc:#1f8a87;--acc-ink:#ffffff;--acc-soft:#dff1f0;
  --ok:#1e8a4c;--ok-soft:#e1f4e8;--bad:#c2393b;--bad-soft:#fbe5e5;--blank:#8a7a1e;--blank-soft:#f6f1d6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514;--card:#18201f;--ink:#e6eeec;--mute:#93a3a0;--line:#2a3533;
    --acc:#3cb6b1;--acc-ink:#06201f;--acc-soft:#173332;
    --ok:#4cc27e;--ok-soft:#163222;--bad:#ef6b6b;--bad-soft:#3a1c1c;--blank:#d4c25a;--blank-soft:#33301a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514;--card:#18201f;--ink:#e6eeec;--mute:#93a3a0;--line:#2a3533;
  --acc:#3cb6b1;--acc-ink:#06201f;--acc-soft:#173332;
  --ok:#4cc27e;--ok-soft:#163222;--bad:#ef6b6b;--bad-soft:#3a1c1c;--blank:#d4c25a;--blank-soft:#33301a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 .6em}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.lbl{font-size:.85rem;color:var(--mute);margin:0 0 8px;font-weight:600}
.set{margin-bottom:16px}.set:last-child{margin-bottom:0}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mute);padding:8px 10px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:15px;font-size:1.05rem}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:4px 0}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
.muted{color:var(--mute);font-size:.88rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.score{display:flex;gap:10px;font-size:.88rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.score b{font-weight:700}
.s-ok{color:var(--ok)}.s-bad{color:var(--bad)}.s-blank{color:var(--blank)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.qtext{font-size:1.12rem;font-weight:600;margin:0 0 16px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.let{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.82rem;font-weight:700;background:var(--bg);color:var(--mute)}
.box{width:14px;height:14px;border:2px solid currentColor;border-radius:3px;display:block}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .let{background:var(--acc);color:var(--acc-ink)}
.opt.sel .box{background:currentColor}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .let{background:var(--ok);color:#fff}
.opt.badopt{border-color:var(--bad);background:var(--bad-soft)}
.opt.badopt .let{background:var(--bad);color:#fff}
input.txt{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font:inherit;background:var(--card);color:var(--ink)}
input.txt:focus{outline:none;border-color:var(--acc)}
input.txt.good{border-color:var(--ok);background:var(--ok-soft)}
input.txt.badopt{border-color:var(--bad);background:var(--bad-soft)}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px}
.mrow.good{border-color:var(--ok);background:var(--ok-soft)}
.mrow.badopt{border-color:var(--bad);background:var(--bad-soft)}
.mrow b{font-size:.98rem}
select{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--line);font:inherit;background:var(--card);color:var(--ink)}
.fb{margin-top:16px;border-radius:11px;padding:14px;border-left:4px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.blank{background:var(--blank-soft);border-color:var(--blank)}
.fb .v{font-weight:700;margin-bottom:4px}
.fb .ca{margin:4px 0;white-space:pre-line}
.fb .ex{color:var(--ink);opacity:.9;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.actions .grow{flex:1}
.kbd{font-size:.78rem;color:var(--mute);margin-top:12px;text-align:center}
.big-score{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat.ok{background:var(--ok-soft);color:var(--ok)}.stat.bad{background:var(--bad-soft);color:var(--bad)}.stat.blank{background:var(--blank-soft);color:var(--blank)}
.rev{border-left:4px solid var(--line);padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rev.ok{border-left-color:var(--ok)}.rev.bad{border-left-color:var(--bad)}.rev.blank{border-left-color:var(--blank)}
.rev .rq{font-weight:600;margin-bottom:6px;white-space:pre-line}
.rev .ra{font-size:.92rem;white-space:pre-line}
.rev .rx{font-size:.88rem;color:var(--mute);margin-top:6px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;font-size:.9rem;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line);padding-bottom:5px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dot{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:.75rem;cursor:pointer}
.dot.ans{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.dot.cur{outline:2px solid var(--acc);outline-offset:1px}
a{color:var(--acc)}
@media (max-width:480px){h1{font-size:1.45rem}.qtext{font-size:1.03rem}.big-score{font-size:2.5rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const KEY = "dor-ut2-usabilidad.v1";

/* ===================== BANCO DE PREGUNTAS (65) ===================== */
const VF = ["Verdadero", "Falso"];
const Q = [
{id:1,q:"¿Cuándo se considera que una página web es usable?",o:["Cuando tiene muchas animaciones y efectos visuales.","Cuando al usuario le resulta fácil utilizar su interfaz.","Cuando contiene la mayor cantidad posible de información.","Cuando utiliza tecnologías novedosas."],a:1,e:"Definición de la unidad: una página es usable si al usuario le resulta fácil el uso de su interfaz."},
{id:2,q:"¿Qué significa la persistencia en un sistema de navegación?",o:["Que los enlaces funcionan correctamente.","Que los elementos gráficos cambian en cada página.","Que los elementos de navegación se colocan siempre en el mismo sitio.","Que el usuario no puede volver a la página anterior."],a:2,e:"Persistencia = los elementos de navegación se colocan siempre en el mismo sitio."},
{id:3,q:"¿En qué consiste una evaluación heurística?",o:["En realizar encuestas a todos los visitantes de la web.","En analizar la interfaz mediante parámetros y directrices de usabilidad.","En medir exclusivamente la velocidad de carga.","En observar únicamente los colores de la página."],a:1,e:"Un experto observa un conjunto de parámetros, normalmente siguiendo las directrices de Nielsen."},
{id:4,q:"¿Qué representa la técnica eye tracking?",o:["El número de clics que recibe cada enlace.","La velocidad de conexión del usuario.","El orden y el tiempo que el usuario dedica a mirar distintas zonas de la página.","Los errores de programación de la web."],a:2,e:"Puntos verdes = tiempo que se detiene la vista. Líneas rojas = orden en que se detiene."},
{id:5,q:"¿Cuándo es preferible realizar un test de usabilidad?",o:["Después de publicar la web y recibir quejas.","Solo cuando la web presenta errores graves.","Antes de publicar la web y después de realizar un análisis heurístico.","Únicamente cuando la web ya tiene muchos usuarios."],a:2,e:"Cuanto antes mejor: antes de publicar el sitio y después del análisis heurístico."},
{id:6,q:"¿Cuáles son los tres conceptos directamente relacionados con la facilidad de uso de una página web?",o:["Diseño, seguridad y velocidad","Eficacia, eficiencia y satisfacción","Accesibilidad, rendimiento y mantenimiento","Navegación, contenido y posicionamiento"],a:1,e:"La facilidad de uso está relacionada con la eficacia, la eficiencia y la satisfacción."},
{id:7,q:"¿Qué significa la persistencia en un sistema de navegación web?",o:["Que los elementos estén siempre colocados en el mismo sitio","Que todos los enlaces tengan el mismo color","Que el usuario recuerde las páginas visitadas","Que la web guarde los datos del usuario"],a:0,e:"Persistencia = mismo sitio en todas las páginas."},
{id:8,q:"¿Cuál de las siguientes prácticas mejora la usabilidad de una página web?",o:["Utilizar siempre diseños novedosos aunque sean difíciles de entender","Evitar dar respuestas a las acciones del usuario","Emplear iconos intuitivos y un lenguaje sencillo","Obligar al usuario a memorizar los pasos de navegación"],a:2,e:"Elementos familiares: iconos intuitivos y un lenguaje cercano, sencillo y comprensible."},
{id:9,q:"¿En qué consiste una evaluación heurística?",o:["En realizar una encuesta a todos los visitantes de la web","En medir únicamente la velocidad de carga de la página","En analizar exclusivamente el posicionamiento web","En que una persona experta evalúe la interfaz siguiendo criterios de usabilidad"],a:3,e:"La realiza una persona con experiencia en usabilidad o en diseño de interfaces."},
{id:10,q:"¿Cuándo se recomienda realizar un test de usabilidad?",o:["Únicamente cuando los usuarios presentan quejas","Lo antes posible, preferiblemente antes de publicar la web y después del análisis heurístico","Solo después de un año de funcionamiento","Antes de realizar cualquier análisis heurístico"],a:1,e:"Antes de publicar y después de la heurística."},
{id:11,q:"¿Cuándo podemos decir que una página web es usable?",o:["Cuando tiene muchas imágenes y animaciones.","Cuando al usuario le resulta fácil utilizar su interfaz.","Cuando tiene muchos enlaces.","Cuando utiliza las tecnologías más novedosas."],a:1,e:"Usable = al usuario le resulta fácil usar su interfaz."},
{id:12,q:"¿Qué significa la consistencia en un sistema de navegación?",o:["Que los elementos de navegación sean coherentes en todas las páginas.","Que todas las páginas tengan el mismo contenido.","Que la web tenga muchos colores diferentes.","Que los usuarios tengan que recordar dónde están los enlaces."],a:0,e:"Consistencia = elementos coherentes en todas las páginas (mismo tema visual: aspecto y comportamiento)."},
{id:13,q:"¿Cuál de las siguientes opciones es una característica de una interfaz usable?",o:["Utilizar un lenguaje técnico y complicado.","Evitar que el usuario pueda volver atrás.","Dar una respuesta inmediata a las acciones del usuario.","Mostrar toda la información de golpe."],a:2,e:"Directriz de los apuntes: dar respuesta inmediata a las acciones de los usuarios."},
{id:14,q:"¿Qué es una evaluación heurística?",o:["Una encuesta realizada a todos los usuarios de una web.","Una evaluación realizada por una persona con experiencia en usabilidad.","Una prueba que mide la velocidad de conexión.","Un método para comprobar si una web tiene virus."],a:1,e:"La hace un experto en usabilidad o diseño de interfaces."},
{id:15,q:"¿En qué consiste un test de usabilidad?",o:["En comprobar únicamente si una página web funciona en móviles.","En analizar el código fuente de una página web.","En medir el número de visitas que recibe una web.","En observar a usuarios reales realizando tareas reales en un sistema."],a:3,e:"Medida concreta y objetiva tomada a partir de usuarios verdaderos que realizan tareas reales."},
{id:16,q:"¿Cuál es la diferencia entre consistencia y persistencia en la navegación?",o:["La consistencia mantiene los elementos en el mismo lugar y la persistencia mantiene los mismos colores.","La consistencia mantiene un diseño coherente y la persistencia mantiene los elementos en el mismo lugar.","La consistencia evita los enlaces rotos y la persistencia permite volver al inicio.","Ambas significan que los elementos deben tener el mismo tamaño."],a:1,e:"Consistencia = coherencia de diseño. Persistencia = mismo lugar."},
{id:17,t:"multi",q:"¿Qué características debe tener una navegación usable? (Respuesta múltiple)",o:["Todo el contenido debe ser accesible mediante menús o enlaces.","Los enlaces rotos son aceptables si el diseño es consistente.","Se debe poder volver a la página de inicio en cualquier momento.","La navegación debe poder utilizarse con teclado y ratón."],a:[0,2,3],e:"Son correctas todas menos la de los enlaces rotos: no deben existir enlaces que no conduzcan a ninguna parte."},
{id:18,fix:1,q:"La evaluación heurística la realiza un especialista que analiza parámetros de usabilidad como la consistencia, el lenguaje y la navegación.",o:VF,a:0,e:"Verdadero. El experto revisa lenguaje, consistencia, memoria del usuario, eficiencia y flexibilidad, diseño, información, ubicación y navegación."},
{id:19,q:"¿Cuál es la diferencia entre una evaluación heurística y una prueba de usabilidad?",o:["La evaluación heurística analiza la interfaz mediante criterios de usabilidad, mientras que la prueba de usabilidad observa a usuarios reales realizando tareas.","La evaluación heurística solo se realiza después de publicar la web y la prueba antes de publicarla.","Ambas consisten únicamente en realizar encuestas.","La prueba de usabilidad solo evalúa los colores y la distribución de la página."],a:0,e:"Heurística = experto con criterios. Test = usuarios reales haciendo tareas reales."},
{id:20,fix:1,q:"La persistencia significa que los elementos de navegación deben mantener su apariencia y comportamiento, aunque cambien de posición entre páginas.",o:VF,a:1,e:"Falso. Mantener apariencia y comportamiento es la consistencia. La persistencia es que estén siempre en el mismo sitio."},
{id:21,q:"¿Cuál es la diferencia entre consistencia y persistencia en un sistema de navegación?",o:["La consistencia mantiene coherentes el diseño y el comportamiento; la persistencia mantiene los elementos en el mismo lugar.","La consistencia coloca los elementos siempre en el mismo sitio; la persistencia utiliza un diseño coherente.","La consistencia evita los enlaces rotos; la persistencia permite volver a la página anterior."],a:0,e:"Consistencia = coherencia de diseño y comportamiento. Persistencia = misma ubicación."},
{id:22,q:"¿Qué información se obtiene mediante la técnica de eye tracking?",o:["El nivel de satisfacción de los usuarios mediante encuestas.","El recorrido visual del usuario, incluyendo el orden y el tiempo que dedica a cada punto.","Los errores de diseño detectados por un experto siguiendo directrices de usabilidad."],a:1,e:"Los puntos indican cuánto tiempo se detiene la mirada y las líneas el orden."},
{id:23,q:"Según los apuntes, ¿cuál es el orden recomendado para realizar un análisis heurístico y un test de usabilidad?",o:["Primero publicar la web, después realizar el test y finalmente el análisis heurístico.","Primero realizar el test de usabilidad y después el análisis heurístico.","Primero realizar el análisis heurístico y después el test de usabilidad, preferiblemente antes de publicar la web."],a:2,e:"Primero la heurística, después el test, y si es posible antes de publicar."},
{id:24,q:"¿Qué debe hacerse para conocer mejor las necesidades de los posibles usuarios de una web?",o:["Crear un perfil que contemple sus características, expectativas, capacidades, conocimientos y limitaciones técnicas, entre otros aspectos.","Diseñar la web según las preferencias del desarrollador y comprobar únicamente que funcione.","Centrarse exclusivamente en la experiencia previa de los usuarios y en el navegador que utilizan."],a:0,e:"Hay que hacer un perfil de usuarios con muchos factores, no solo uno o dos."},
{id:25,q:"Durante un test de usabilidad, ¿qué actuación se ajusta a lo indicado en los apuntes?",o:["Permitir que los participantes interactúen entre sí para resolver las tareas más rápidamente.","Observar la interacción de cada usuario, sus reacciones y el tiempo que tarda en completar las tareas.","Realizar la prueba sin planificar las tareas para comprobar cómo reacciona el usuario espontáneamente."],a:1,e:"Se observa la interacción de cada usuario, sus reacciones y el tiempo. No deben interactuar entre sí y el test debe estar planificado."},
{id:26,q:"¿Qué tres aspectos están directamente relacionados con la facilidad de uso de una web?",o:["Diseño, publicidad y posicionamiento.","Eficacia, eficiencia y satisfacción.","Velocidad, contenido y número de visitas.","Accesibilidad, originalidad y complejidad."],a:1,e:"Eficacia, eficiencia y satisfacción."},
{id:27,q:"¿Qué significa la persistencia en un sistema de navegación?",o:["Que los elementos se colocan siempre en el mismo sitio.","Que el usuario debe recordar el recorrido realizado.","Que todos los enlaces tienen el mismo color.","Que la página permanece abierta durante la sesión."],a:0,e:"Persistencia = mismo sitio."},
{id:28,q:"¿Cuál de estas prácticas favorece la usabilidad de una interfaz?",o:["Mostrar toda la información de una sola vez.","Utilizar términos técnicos para dar una imagen profesional.","Cambiar el diseño del menú en cada página.","Dar una respuesta inmediata a las acciones del usuario."],a:3,e:"Dar respuesta inmediata a las acciones del usuario es una de las directrices."},
{id:29,q:"¿Quién realiza una evaluación heurística?",o:["Únicamente los usuarios habituales del sitio.","Cualquier usuario que responda una encuesta de satisfacción.","Una persona con experiencia en usabilidad o diseño de interfaces.","Un programa que comprueba exclusivamente los enlaces rotos."],a:2,e:"La realiza un experto en usabilidad o diseño de interfaces."},
{id:30,q:"¿Cuándo recomienda el documento realizar un test de usabilidad?",o:["Solo después de publicar el sitio web.","Cuanto antes, preferiblemente antes de publicar y después de un análisis heurístico.","Únicamente cuando los usuarios comunican errores.","Antes del análisis heurístico y sin planificar las tareas."],a:1,e:"Cuanto antes, antes de publicar y después de la heurística."},
{id:31,q:"¿Cuál de las siguientes afirmaciones describe correctamente la relación entre eficacia, eficiencia y satisfacción en la usabilidad?",o:["La eficacia consiste en realizar una tarea utilizando el menor número de recursos posible.","La eficiencia se refiere a que el usuario consiga alcanzar sus objetivos.","La satisfacción está relacionada con la valoración positiva que experimenta el usuario al utilizar la interfaz.","La eficacia y la eficiencia son conceptos equivalentes."],a:2,e:"Trampa: dos opciones tienen intercambiadas las definiciones. Eficacia = logra lo que quiere; eficiencia = sin esfuerzo; satisfacción = valoración positiva."},
{id:32,q:"¿Cuál de las siguientes prácticas NO se recomienda al diseñar una interfaz usable?",o:["Utilizar iconos intuitivos y familiares para los usuarios.","Proporcionar una respuesta inmediata a las acciones del usuario.","Introducir elementos novedosos aunque dificulten la comprensión de la interfaz.","Mantener la consistencia en los elementos gráficos."],a:2,e:"IMPORTANTE de los apuntes: lo novedoso no siempre es lo más adecuado."},
{id:33,q:"Al elaborar el perfil de los posibles usuarios de un sitio web, ¿cuál de los siguientes aspectos debe tenerse en cuenta?",o:["Únicamente la edad y el nivel educativo de los usuarios.","Sus capacidades, experiencia previa, limitaciones técnicas y plataforma utilizada.","Exclusivamente sus conocimientos de programación y diseño web.","Solamente el navegador y el sistema operativo que utilizan."],a:1,e:"El perfil abarca muchos factores. Desconfía de «únicamente», «exclusivamente» y «solamente»."},
{id:34,q:"¿Cuál es la diferencia entre consistencia y persistencia en un sistema de navegación?",o:["La consistencia implica mantener los elementos en la misma posición, mientras que la persistencia se refiere a utilizar los mismos colores.","La consistencia se refiere exclusivamente al diseño gráfico y la persistencia al funcionamiento de los enlaces.","Ambos conceptos significan exactamente lo mismo.","La consistencia implica mantener la coherencia visual y de comportamiento, mientras que la persistencia supone colocar los elementos siempre en el mismo lugar."],a:3,e:"Consistencia = coherencia visual y de comportamiento. Persistencia = mismo lugar."},
{id:35,q:"¿Cuál de las siguientes afirmaciones sobre el diseño de un sistema de navegación es INCORRECTA?",o:["Todos los contenidos deben ser accesibles mediante el menú principal o mediante enlaces.","Los enlaces deben mostrar el contenido que el usuario espera encontrar.","El acceso a las opciones de navegación debe realizarse exclusivamente mediante el ratón.","El usuario debe poder regresar a la página principal en cualquier momento."],a:2,e:"Se busca la INCORRECTA: debe poder usarse con teclado y ratón, no solo con ratón."},
{id:36,q:"Un desarrollador está diseñando una página web y quiere mejorar la usabilidad de su sistema de navegación. ¿Cuál de las siguientes situaciones representa correctamente la diferencia entre consistencia y persistencia?",o:["La consistencia consiste en mantener los elementos de navegación en el mismo lugar, mientras que la persistencia consiste en utilizar siempre los mismos colores e iconos.","La consistencia consiste en mantener un diseño y comportamiento coherentes entre las páginas, mientras que la persistencia consiste en colocar los elementos de navegación siempre en el mismo sitio.","La consistencia consiste en permitir volver a la página principal, mientras que la persistencia consiste en mostrar la ruta recorrida por el usuario.","La consistencia consiste en evitar enlaces rotos, mientras que la persistencia consiste en mantener actualizados los contenidos.","La consistencia consiste en utilizar un menú principal, mientras que la persistencia consiste en incluir un buscador en todas las páginas."],a:1,e:"Consistencia = coherencia. Persistencia = mismo sitio."},
{id:37,q:"Una empresa quiere detectar los problemas de usabilidad de su página web antes de publicarla y, además, obtener propuestas para solucionarlos. Según los apuntes, ¿qué estrategia resulta más adecuada?",o:["Publicar la página y realizar encuestas a los usuarios habituales para identificar los problemas antes de proponer cambios.","Utilizar exclusivamente la técnica eye tracking, ya que permite detectar todos los errores de diseño y proponer soluciones automáticamente.","Realizar una evaluación heurística y un test de usabilidad antes de publicar la página, ya que ambos métodos se complementan.","Realizar primero encuestas a usuarios habituales y, después de publicar la página, contratar a un experto para evaluar su navegación.","Realizar únicamente un test de usabilidad después de publicar la página, porque la evaluación heurística solo sirve para medir la satisfacción de los usuarios."],a:2,e:"Antes de divulgar: heurística (propone soluciones) + test (muestra dónde están los problemas). Se complementan."},
{id:38,q:"Un experto analiza una página web mediante una evaluación heurística. Comprueba que el lenguaje es comprensible, los elementos gráficos son coherentes y la información está bien agrupada. Sin embargo, descubre que algunos enlaces no conducen a ningún sitio y que los usuarios no siempre saben dónde se encuentran.\n¿Qué afirmación describe mejor este procedimiento?",o:["Es un test de usabilidad porque el experto comprueba directamente cuánto tardan los usuarios en completar tareas reales.","Es una encuesta de satisfacción porque se centra en conocer las opiniones de los usuarios sobre la navegación.","Es una técnica eye tracking porque permite identificar los enlaces que los usuarios miran durante más tiempo.","Es una evaluación heurística en la que el experto comprueba determinados parámetros y las respuestas negativas permiten detectar problemas de usabilidad.","Es una prueba de accesibilidad exclusivamente técnica, porque los enlaces rotos y la ubicación del usuario no forman parte de la usabilidad."],a:3,e:"Un experto revisando parámetros = evaluación heurística. Las respuestas negativas detectan los problemas."},
{id:39,q:"Un equipo de desarrollo quiere diseñar una web que se adapte a las necesidades de sus posibles usuarios. Para ello, estudia su experiencia previa, sus conocimientos, sus posibles discapacidades, el dispositivo que utilizan y el tipo de conexión del que disponen.\n¿Cuál es la interpretación más adecuada de estas acciones según los apuntes?",o:["El equipo está realizando una evaluación heurística, ya que todos esos datos permiten responder afirmativa o negativamente a las preguntas de un experto.","El equipo está elaborando un perfil de los posibles usuarios para conocer sus características y necesidades antes de diseñar la web.","El equipo está realizando una prueba de usabilidad, ya que el análisis de las conexiones y los dispositivos demuestra cuánto tardan los usuarios en completar tareas.","El equipo está utilizando eye tracking, porque conocer la experiencia previa permite determinar el orden en el que los usuarios miran los elementos.","El equipo está aplicando la persistencia del sistema de navegación, porque conocer los dispositivos permite mantener los menús en la misma posición."],a:1,e:"Es el perfil de usuarios: características, expectativas, capacidades, experiencia, discapacidad, plataforma, conexión…"},
{id:40,q:"Una empresa va a realizar un test de usabilidad con usuarios de diferentes niveles de experiencia y algunas personas con discapacidad. El equipo prepara las tareas, establece los tiempos esperados, selecciona el lugar de realización y comprueba que dispone de tecnología asistida.\n¿Cuál de las siguientes afirmaciones es correcta según los apuntes?",o:["El test debe realizarse preferentemente después de publicar la web, ya que antes de su publicación no se pueden detectar problemas reales.","El lugar debe permitir que los participantes interactúen entre sí para que puedan ayudarse a completar las tareas.","El test debe planificarse teniendo en cuenta las tareas, el momento de realización y el tiempo considerado adecuado; además, debe observarse la interacción de los usuarios y anotarse el tiempo empleado.","La duración debe ser idéntica en todos los casos, independientemente del número de participantes y de las tareas que deban realizar.","La tecnología asistida no es necesaria cuando se evalúa la usabilidad, porque las personas con discapacidad deben realizar las pruebas en las mismas condiciones técnicas que el resto de los usuarios."],a:2,e:"Planificar tareas, momento y tiempo correcto; observar la interacción y anotar el tiempo. La duración depende del número de personas."},
{id:41,q:"La facilidad de uso de una web está directamente relacionada con:",o:["La estética, la velocidad de carga y el posicionamiento.","El contenido, los servicios y el posicionamiento.","La eficacia, la eficiencia y la satisfacción.","La consistencia, la persistencia y la accesibilidad.","La eficacia, la estética y la rentabilidad."],a:2,e:"Ojo: contenido, servicios y posicionamiento son los factores del ÉXITO de una web, no de la facilidad de uso."},
{id:42,q:"La eficiencia significa que el usuario:",o:["Logra lo que quiere.","Lo logra sin esfuerzo.","Reporta satisfacción.","Encuentra los elementos siempre en el mismo sitio.","Puede usar tanto el teclado como el ratón."],a:1,e:"Eficiencia = lo logra sin esfuerzo. «Logra lo que quiere» es la eficacia."},
{id:43,q:"¿Qué elemento del sistema de navegación responde a «¿Cómo llegué aquí?»?",o:["El logotipo enlazado a la página principal.","El enlace al mapa del sitio.","El sistema de búsqueda.","El sistema de navegación que informa del camino recorrido desde la página principal.","El menú de navegación principal."],a:3,e:"Dónde estoy → navegación principal. Cómo llegué → camino recorrido. A dónde ir → mapa del sitio. Regresar → logotipo."},
{id:44,q:"En eye tracking, el tamaño de los puntos verdes representa:",o:["El orden en el que el usuario se ha detenido en cada punto.","El número de clics realizados en esa zona.","La cantidad de tiempo que el usuario ha detenido su vista en ese punto.","Las zonas de la página con enlaces rotos.","Las secciones que el usuario considera más interesantes según la encuesta."],a:2,e:"Verde = tiempo. Rojo = orden."},
{id:45,q:"¿Cuándo debe realizarse un test de usabilidad?",o:["Una vez publicado el sitio, para contar con usuarios reales.","Antes de realizar el análisis heurístico.","Solo cuando los usuarios se quejen de algún problema.","Cuanto antes, preferiblemente antes de publicar y después de un análisis heurístico.","Al mismo tiempo que las encuestas de satisfacción."],a:3,e:"Cuanto antes, antes de publicar y después de la heurística."},
{id:46,q:"¿Cuáles son los tres componentes fundamentales que definen la usabilidad según el diagrama de interacción de interfaces?",o:["Diseño, maquetación y tipografía.","Eficacia, eficiencia y satisfacción.","Accesibilidad, interactividad y velocidad de carga.","Información, branding y marketing."],a:1,e:"Eficacia, eficiencia y satisfacción (los tres círculos del diagrama)."},
{id:47,q:"¿Qué preguntas clave debe poder responder un usuario en todo momento para considerar que una interfaz cuenta con un buen sistema de navegación?",o:["¿Dónde estoy?, ¿cómo llegué aquí?, ¿a dónde puedo ir después?, ¿qué puedo hacer en este momento? y ¿cómo puedo regresar?","¿Cuánto cuesta la web?, ¿cuál es el servidor?, ¿quién es el diseñador? y ¿cuántas visitas tiene?","¿Qué lenguaje de programación se usó?, ¿qué base de datos hay detrás? y ¿cuál es la resolución de pantalla?","¿Qué navegador utilizo?, ¿cuál es mi velocidad de red? y ¿tengo el plugin actualizado?"],a:0,e:"Son las cinco preguntas de una interfaz usable."},
{id:48,q:"En el contexto de la evaluación de la usabilidad, ¿en qué consiste principalmente una evaluación heurística?",o:["En realizar pruebas con usuarios reales que ejecutan tareas específicas en un laboratorio cerrado.","En una revisión por parte de 3 a 5 expertos en usabilidad que inspeccionan la interfaz guiándose por un conjunto de directrices o principios (heurísticas).","En una encuesta masiva de satisfacción enviada por correo electrónico a los clientes una vez publicada la página.","En el análisis automático de los clics y el movimiento del ratón mediante herramientas de heatmap."],a:1,e:"De 3 a 5 evaluadores expertos que siguen heurísticas (Nielsen). Usuarios reales haciendo tareas sería el test de usabilidad."},
{id:49,q:"¿Qué diferencia conceptual existe entre consistencia y persistencia dentro de un sistema de navegación web?",o:["La consistencia indica que los elementos gráficos mantienen el mismo tema visual y comportamiento, mientras que la persistencia implica que dichos elementos se colocan siempre en el mismo sitio.","La consistencia se refiere a la velocidad de carga y la persistencia a que el servidor no se caiga.","Son exactamente el mismo concepto aplicado a diferentes navegadores web.","La persistencia hace referencia a los colores del menú y la consistencia a los atajos de teclado."],a:0,e:"Consistencia = mismo tema visual y comportamiento. Persistencia = mismo sitio."},
{id:50,fix:1,q:"En un test de usabilidad con usuarios reales, el lugar de realización debe escogerse cuidadosamente para que los participantes se sientan a gusto y no puedan interactuar entre sí.",o:VF,a:0,e:"Verdadero. Es lo que dicen los apuntes sobre el lugar."},
{id:51,q:"Analizas un mapa de eye tracking de tu página de inicio. ¿Qué representan sus elementos?",o:["Los puntos verdes, el orden de lectura; las líneas rojas, el tiempo de cada fijación.","El tamaño de los puntos verdes, el tiempo que la vista se detiene; las líneas rojas, el orden en que se detiene.","Los puntos verdes, los clics del ratón; las líneas rojas, el desplazamiento por la página.","El color de los puntos indica la satisfacción del usuario en cada zona de la página."],a:1,e:"Tamaño del punto verde = tiempo. Líneas rojas = orden. Cuidado con la opción que lo dice al revés."},
{id:52,q:"Sobre la evaluación heurística, ¿qué afirmación es correcta?",o:["La realiza un grupo amplio de usuarios reales que contestan qué les ha resultado difícil.","Las preguntas contestadas de forma afirmativa son las que detectan problemas de usabilidad.","El trabajo es individual, luego grupal para reunir los problemas en una lista común, y otra vez individual para calificarlos por frecuencia, severidad y criticidad.","Solo se puede aplicar al final del desarrollo, una vez publicada la página."],a:2,e:"Fases: individual → grupal → individual. La hacen expertos (3–5), las respuestas NEGATIVAS detectan problemas y es aplicable en cualquier etapa."},
{id:53,q:"Durante una evaluación heurística, el experto se pregunta: «¿hay enlaces directos a la información relevante?» y «¿debe el usuario recordar demasiadas cosas?». ¿A qué parámetro observado corresponden?",o:["Información","Eficiencia y flexibilidad","Ubicación y navegación","Memoria del usuario"],a:3,e:"Ambas son de «Memoria del usuario»."},
{id:54,q:"Estás planificando un test de usabilidad. ¿Qué decisión se ajusta a los apuntes?",o:["Hacerlo antes del análisis heurístico, para que el experto parta de datos reales.","Reunir a los usuarios en una sala común para que comenten la interfaz mientras la usan.","Usar solo equipos potentes con buena conexión, para que la tecnología no influya en el resultado.","Elegir un lugar donde se sientan a gusto y no puedan interactuar entre sí, y realizarlo después del análisis heurístico."],a:3,e:"Después de la heurística, sin interacción entre usuarios y probando también con conexiones lentas y dispositivos portátiles."},
{id:55,q:"Un diseñador sustituye las flechas para cambiar de página por iconos abstractos originales, sin ninguna reacción al pasar el ratón, porque «queda más moderno». ¿Qué principio de los apuntes vulnera más directamente?",o:["Usar elementos familiares e intuitivos: lo novedoso no siempre es lo más adecuado.","La persistencia, porque los iconos cambian de sitio entre páginas.","Dar libertad de uso al usuario experto con atajos y aceleradores.","El perfil de usuario, porque no se ha estudiado el tipo de conexión."],a:0,e:"Iconos intuitivos (flechas) y reacción al pasar el ratón; si no, «habrá que ser adivino». Lo novedoso no siempre es lo más adecuado."},
{id:56,t:"text",q:"¿Qué factor del diseño web hace referencia a que los elementos en un sistema de navegación mantengan el mismo tema visual (aspecto y comportamiento) en todas las páginas?",acc:["Consistencia"],e:"Consistencia. (Si fuera «en el mismo lugar», sería persistencia)."},
{id:57,q:"¿Qué método para analizar la usabilidad debería utilizar primero una empresa que quiere evitar publicar una web con posibles fallos graves?",o:["Test de usuarios reales","Eye tracking","Evaluación heurística"],a:2,e:"Primero la evaluación heurística; el test de usabilidad se hace después de ella. Ambos antes de publicar."},
{id:58,t:"text",q:"¿Qué método para analizar la usabilidad es el que muestra el nivel de satisfacción de los usuarios?",acc:["Encuestas","encuesta","realizar encuestas","encuestas de satisfaccion","encuesta de satisfaccion"],e:"Encuestas: usuarios habituales, una vez divulgada la página, para medir su nivel de satisfacción."},
{id:59,t:"match",q:"Empareja cada concepto con su significado:",p:[["Eficacia","El usuario logra lo que quiere."],["Eficiencia","El usuario logra lo que quiere sin esfuerzo."],["Satisfacción","El usuario reporta satisfacción."]],e:"Eficacia = la diana (lo consigue). Eficiencia = el reloj (sin esfuerzo). Satisfacción = el medidor (reporta satisfacción)."},
{id:60,fix:1,q:"La facilidad de uso de una interfaz web solamente está relacionada con el nivel de satisfacción de los usuarios tras su uso.",o:VF,a:1,e:"Falso. Está relacionada con eficacia, eficiencia Y satisfacción. Ojo con «solamente»."},
{id:61,q:"¿Qué heurística refuerza la idea de que «lo novedoso no siempre es lo más adecuado»?",o:["Flexibilidad y eficiencia","Consistencia y estándares","Control del usuario","Prevención de errores"],a:1,e:"Consistencia y estándares: seguir convenciones que el usuario ya conoce. Un diseño «novedoso» rompe esas convenciones."},
{id:62,fix:1,q:"El éxito de un sitio web dependerá únicamente de los servicios que ofrezca.",o:VF,a:1,e:"Falso. Depende de su contenido, los servicios que ofrezca y lo bien posicionado que esté."},
{id:63,fix:1,q:"La usabilidad de un sitio web será la garantía de que será elegido entre los muchos sitios web de características similares.",o:VF,a:0,e:"Verdadero. Frase literal de los apuntes."},
{id:64,t:"text",q:"¿Qué factor del diseño web hace referencia a que los elementos en un sistema de navegación se coloquen siempre en el mismo lugar?",acc:["Persistencia"],e:"Persistencia. (Si fuera «mismo tema visual», sería consistencia)."},
{id:65,t:"text",q:"¿Qué método para analizar la usabilidad es el más eficiente si lo que se quiere es proponer soluciones alternativas?",acc:["Evaluación heurística","heuristica","evaluacion heuristica","analisis heuristico","evaluaciones heuristicas","la evaluacion heuristica"],e:"Evaluación heurística: propone soluciones alternativas. El test de usabilidad muestra dónde están los problemas."}
];
Q.forEach(q=>{ if(!q.t) q.t="mc"; });

/* ===================== ESTADO ===================== */
const DEF = {n:"all", mode:"inst", pen:false, shuf:true};
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
const store = Object.assign({fallos:[], hist:[]}, load());
store.cfg = Object.assign({}, DEF, store.cfg||{});
store.fallos = (store.fallos||[]).filter(id=>Q.some(q=>q.id===id));
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

const app = document.getElementById("app");
const LET = "ABCDE";
let run = null, view = "home", revOnlyBad = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9ñ ]/g," ").replace(/\s+/g," ").trim()
    .replace(/^(la|el|las|los|una|un) /,"");
}
const fmt = x => (Math.round(x*100)/100).toLocaleString("es-ES");

/* ===================== LÓGICA ===================== */
function makeOrd(q){
  if(q.t==="mc"||q.t==="multi"){ const idx=q.o.map((_,i)=>i); return q.fix?idx:shuffle(idx); }
  if(q.t==="match") return shuffle(q.p.map((_,i)=>i));
  return null;
}
function grade(it){
  const q=it.q, r=it.resp;
  if(r===null||r===undefined||r===""||(Array.isArray(r)&&r.length===0)) return "blank";
  if(q.t==="mc") return r===q.a?"ok":"bad";
  if(q.t==="multi") return r.slice().sort().join()===q.a.slice().sort().join()?"ok":"bad";
  if(q.t==="text"){ if(!norm(r)) return "blank"; return q.acc.some(a=>norm(a)===norm(r))?"ok":"bad"; }
  if(q.t==="match"){ if(r.every(x=>x<0)) return "blank"; return r.every((x,i)=>x===i)?"ok":"bad"; }
}
function correctText(q){
  if(q.t==="mc") return q.o[q.a];
  if(q.t==="multi") return q.a.map(i=>"• "+q.o[i]).join("\n");
  if(q.t==="text") return q.acc[0];
  if(q.t==="match") return q.p.map(([l,r])=>l+" → "+r).join("\n");
}
function respText(it){
  const q=it.q, r=it.resp;
  if(grade(it)==="blank") return "En blanco";
  if(q.t==="mc") return q.o[r];
  if(q.t==="multi") return r.map(i=>"• "+q.o[i]).join("\n");
  if(q.t==="text") return r;
  if(q.t==="match") return q.p.map(([l],i)=>l+" → "+(r[i]>=0?q.p[r[i]][1]:"—")).join("\n");
}
function stats(onlyChecked){
  let ok=0,bad=0,blank=0;
  run.items.forEach(it=>{
    if(onlyChecked && !it.checked) return;
    const g=grade(it); if(g==="ok")ok++; else if(g==="bad")bad++; else blank++;
  });
  const net = ok - (run.pen ? bad/3 : 0);
  return {ok,bad,blank,net};
}
function start(ids, label){
  let qs = ids.map(id=>Q.find(q=>q.id===id));
  if(store.cfg.shuf) qs = shuffle(qs);
  run = {mode:store.cfg.mode, pen:store.cfg.pen, i:0, label:label||"",
         items: qs.map(q=>({q, ord:makeOrd(q), resp:null, checked:false})), finished:false};
  view="q"; render();
}
function startFromCfg(){
  let ids = Q.map(q=>q.id);
  const n = store.cfg.n==="all" ? ids.length : Math.min(+store.cfg.n, ids.length);
  if(n<ids.length){ ids = shuffle(ids).slice(0,n); if(!store.cfg.shuf) ids.sort((a,b)=>a-b); }
  start(ids, n===Q.length?"Banco completo":n+" preguntas");
}
function check(){
  const it=run.items[run.i]; if(it.checked) return;
  it.checked=true; render();
}
function next(){
  if(run.i < run.items.length-1){ run.i++; render(); window.scrollTo({top:0}); }
  else finish();
}
function finish(){
  run.finished=true;
  run.items.forEach(it=>{ it.checked=true; });
  const s=stats(false);
  const set=new Set(store.fallos);
  run.items.forEach(it=>{ if(grade(it)==="ok") set.delete(it.q.id); else set.add(it.q.id); });
  store.fallos=[...set].sort((a,b)=>a-b);
  store.hist.unshift({d:Date.now(), n:run.items.length, ok:s.ok, bad:s.bad, blank:s.blank, net:s.net, pen:run.pen, m:run.mode});
  store.hist=store.hist.slice(0,15);
  save(); revOnlyBad=false; view="end"; render(); window.scrollTo({top:0});
}

/* ===================== VISTAS ===================== */
function render(){ if(view==="home") renderHome(); else if(view==="q") renderQ(); else renderEnd(); }

function chip(act,val,on,txt){ return `<button class="chip${on?" on":""}" data-act="${act}" data-v="${val}">${txt}</button>`; }

function renderHome(){
  const c=store.cfg, nf=store.fallos.length;
  const hist = store.hist.length ? `<div class="card"><h2>Últimos intentos</h2><div class="hist">${
    store.hist.slice(0,6).map(h=>{
      const d=new Date(h.d);
      const nota = Math.max(0,h.net)/h.n*10;
      return `<div><span>${d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})} ${d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})} · ${h.n} preg.</span><span><span class="s-ok">✓${h.ok}</span> <span class="s-bad">✗${h.bad}</span> · <b>${fmt(nota)}</b>/10</span></div>`;
    }).join("")}</div></div>` : "";
  app.innerHTML = `
  <span class="eyebrow">DOR · 2.º DAW · CIFP Zonzamas</span>
  <h1>UT2 · Usabilidad web</h1>
  <p class="sub">${Q.length} preguntas del banco de clase. Tipo test, verdadero/falso, respuesta múltiple, emparejar y respuesta corta.</p>

  <div class="card">
    <div class="set"><p class="lbl">Número de preguntas</p><div class="row">
      ${chip("n","20",c.n==="20","20")}${chip("n","40",c.n==="40","40")}${chip("n","all",c.n==="all","Todas ("+Q.length+")")}
    </div></div>
    <div class="set"><p class="lbl">Modo</p><div class="row">
      ${chip("mode","inst",c.mode==="inst","Corrección al momento")}${chip("mode","exam",c.mode==="exam","Simulacro de examen")}
    </div>
    <p class="muted" style="margin:8px 0 0">${c.mode==="inst"?"Ves si aciertas y la explicación después de cada pregunta.":"Respondes todo sin ver nada y corriges al final, como en el examen."}</p></div>
    <div class="set">
      <label class="toggle"><input type="checkbox" data-act="shuf" ${c.shuf?"checked":""}> Desordenar preguntas y opciones</label>
      <label class="toggle"><input type="checkbox" data-act="pen" ${c.pen?"checked":""}> Penalizar fallos (3 mal restan 1 bien)</label>
    </div>
  </div>

  <button class="btn big" data-act="start">Empezar</button>
  <div class="row" style="margin:12px 0 18px">
    <button class="btn sec" style="flex:1" data-act="fallos" ${nf?"":"disabled"}>Repasar mis fallos (${nf})</button>
    ${nf?`<button class="btn ghost" data-act="clearf">Borrar fallos</button>`:""}
  </div>
  ${hist}
  <p class="muted" style="text-align:center">Tu progreso se guarda solo en este navegador.</p>`;
}

function renderQ(){
  const it=run.items[run.i], q=it.q, N=run.items.length;
  const inst = run.mode==="inst";
  const show = inst && it.checked;
  const g = show ? grade(it) : null;
  const s = stats(true);
  const answered = run.items.filter(x=>grade(x)!=="blank").length;

  const score = inst
    ? `<div class="score"><span class="s-ok">✓ <b>${s.ok}</b></span><span class="s-bad">✗ <b>${s.bad}</b></span><span class="s-blank">○ <b>${s.blank}</b></span><span>Neta <b>${fmt(s.net)}</b></span></div>`
    : `<div class="score"><span>Respondidas <b>${answered}</b>/${N}</span></div>`;

  const typeTag = {mc: q.fix?"Verdadero / Falso":"Tipo test", multi:"Respuesta múltiple · marca todas las correctas", text:"Respuesta corta", match:"Emparejar"}[q.t];

  let body="";
  if(q.t==="mc"||q.t==="multi"){
    body = `<div class="opts">`+it.ord.map((oi,k)=>{
      const sel = q.t==="mc" ? it.resp===oi : (it.resp||[]).includes(oi);
      let cls="opt"+(sel?" sel":"");
      if(show){ const good = q.t==="mc" ? oi===q.a : q.a.includes(oi); cls="opt"+(good?" good":(sel?" badopt":"")); }
      const mark = q.t==="multi" ? `<span class="box"></span>` : LET[k];
      return `<button class="${cls}" data-act="pick" data-v="${oi}" ${show?"disabled":""}><span class="let">${mark}</span><span>${esc(q.o[oi])}</span></button>`;
    }).join("")+`</div>`;
  } else if(q.t==="text"){
    const cls = show ? (g==="ok"?" good":" badopt") : "";
    body = `<input id="txt" class="txt${cls}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta…" value="${esc(it.resp||"")}" ${show?"disabled":""}>
      <p class="muted" style="margin:8px 0 0">No importan mayúsculas ni tildes.</p>`;
  } else if(q.t==="match"){
    const r = it.resp || q.p.map(()=>-1);
    body = q.p.map(([l],i)=>{
      const cls = show ? (r[i]===i?" good":" badopt") : "";
      return `<div class="mrow${cls}"><b>${esc(l)}</b>
        <select data-row="${i}" ${show?"disabled":""}><option value="-1">— Elige —</option>${
          it.ord.map(ri=>`<option value="${ri}" ${r[i]===ri?"selected":""}>${esc(q.p[ri][1])}</option>`).join("")}</select></div>`;
    }).join("");
  }

  let fb="";
  if(show){
    const v = g==="ok"?"✓ ¡Correcto!":g==="bad"?"✗ Incorrecto":"○ En blanco";
    const showCa = g!=="ok" || q.t==="text";
    fb = `<div class="fb ${g}"><div class="v">${v}</div>${showCa?`<div class="ca"><b>Respuesta correcta:</b> ${q.t==="mc"||q.t==="text"?"":"<br>"}${esc(correctText(q))}</div>`:""}<div class="ex">${esc(q.e)}</div></div>`;
  }

  let actions="";
  if(inst){
    if(!it.checked){
      const needCheck = q.t!=="mc";
      actions = `<button class="btn ghost" data-act="blank">Dejar en blanco</button>${needCheck?`<button class="btn" data-act="check">Comprobar</button>`:""}`;
    } else {
      actions = `<span></span><button class="btn" data-act="next" id="nextBtn">${run.i<N-1?"Siguiente →":"Ver resultados"}</button>`;
    }
  } else {
    actions = `<button class="btn sec" data-act="prev" ${run.i===0?"disabled":""}>← Anterior</button>
      ${run.i<N-1?`<button class="btn" data-act="enext">Siguiente →</button>`:`<button class="btn" data-act="finish">Terminar y corregir</button>`}`;
  }

  const dots = inst ? "" : `<div class="dots">${run.items.map((x,k)=>`<button class="dot${grade(x)!=="blank"?" ans":""}${k===run.i?" cur":""}" data-act="go" data-v="${k}">${k+1}</button>`).join("")}</div>`;

  app.innerHTML = `
  <div class="top">
    <button class="btn ghost" data-act="exit">← Salir</button>
    ${score}
    ${inst?"":`<button class="btn ghost" data-act="finish">Terminar</button>`}
  </div>
  <div class="bar"><i style="width:${((run.i+(inst&&it.checked?1:0))/N*100).toFixed(1)}%"></i></div>
  <div class="card">
    <div class="qmeta"><span class="tag">${run.i+1} / ${N}</span><span class="tag">${typeTag}</span><span class="muted">Nº ${q.id} del banco</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${body}
    ${fb}
    <div class="actions">${actions}</div>
    ${dots}
  </div>
  <p class="kbd">Teclado: A–E o 1–5 para elegir · Enter para comprobar / siguiente${inst?"":" · ← → para moverte"}</p>`;

  if(q.t==="text" && !show){ const t=document.getElementById("txt"); if(t && matchMedia("(pointer:fine)").matches) t.focus(); }
  if(show){ const nb=document.getElementById("nextBtn"); if(nb && matchMedia("(pointer:fine)").matches) nb.focus({preventScroll:true}); }
}

function renderEnd(){
  const s=stats(false), N=run.items.length;
  const nota = Math.max(0,s.net)/N*10;
  const badIds = run.items.filter(it=>grade(it)!=="ok").map(it=>it.q.id);
  const list = run.items.map((it,k)=>({it,k,g:grade(it)})).filter(x=>!revOnlyBad||x.g!=="ok");
  app.innerHTML = `
  <span class="eyebrow">Resultado · ${run.mode==="inst"?"Corrección al momento":"Simulacro de examen"}</span>
  <div class="card" style="text-align:center;margin-top:8px">
    <div class="big-score">${fmt(nota)}<span style="font-size:1.2rem;color:var(--mute)"> / 10</span></div>
    <p class="muted" style="margin:8px 0 0">Neta ${fmt(s.net)} de ${N}${run.pen?" (con penalización −⅓ por fallo)":""}</p>
    <div class="grid3">
      <div class="stat ok"><b>${s.ok}</b>Bien</div>
      <div class="stat bad"><b>${s.bad}</b>Mal</div>
      <div class="stat blank"><b>${s.blank}</b>En blanco</div>
    </div>
    <div class="row" style="justify-content:center">
      ${badIds.length?`<button class="btn" data-act="retrybad">Repetir los ${badIds.length} fallos</button>`:""}
      <button class="btn sec" data-act="again">Nueva ronda</button>
      <button class="btn sec" data-act="home">Inicio</button>
    </div>
  </div>
  <div class="top" style="margin-top:6px"><h2 style="margin:0">Revisión</h2>
    <label class="toggle muted"><input type="checkbox" data-act="onlybad" ${revOnlyBad?"checked":""}> Solo fallos y en blanco</label></div>
  ${list.length?list.map(({it,k,g})=>`
    <div class="rev ${g}">
      <div class="rq">${k+1}. ${esc(it.q.q)}</div>
      <div class="ra"><b class="s-${g}">${g==="ok"?"✓":g==="bad"?"✗":"○"} Tu respuesta:</b> ${esc(respText(it))}</div>
      ${g!=="ok"?`<div class="ra"><b class="s-ok">Correcta:</b> ${esc(correctText(it.q))}</div>`:""}
      <div class="rx">${esc(it.q.e)}</div>
    </div>`).join(""):`<p class="muted">¡Sin fallos! 🎉</p>`}`;
}

/* ===================== EVENTOS ===================== */
function act(a, v){
  const c=store.cfg;
  switch(a){
    case "n": c.n=v; save(); render(); break;
    case "mode": c.mode=v; save(); render(); break;
    case "shuf": c.shuf=!c.shuf; save(); break;
    case "pen": c.pen=!c.pen; save(); break;
    case "start": startFromCfg(); break;
    case "fallos": if(store.fallos.length) start(store.fallos.slice(), "Repaso de fallos"); break;
    case "clearf": if(confirm("¿Borrar la lista de fallos guardados?")){ store.fallos=[]; save(); render(); } break;
    case "exit": if(run && !run.finished && !confirm("¿Salir? Se perderá esta ronda.")) break; view="home"; run=null; render(); break;
    case "home": view="home"; run=null; render(); window.scrollTo({top:0}); break;
    case "again": startFromCfg(); break;
    case "retrybad": start(run.items.filter(it=>grade(it)!=="ok").map(it=>it.q.id), "Fallos de la ronda"); break;
    case "onlybad": revOnlyBad=!revOnlyBad; render(); break;
    case "pick": {
      const it=run.items[run.i], oi=+v;
      if(run.mode==="inst" && it.checked) break;
      if(it.q.t==="mc"){ it.resp=oi; if(run.mode==="inst"){ it.checked=true; } render(); }
      else { const r=new Set(it.resp||[]); r.has(oi)?r.delete(oi):r.add(oi); it.resp=[...r]; render(); }
      break;
    }
    case "check": check(); break;
    case "blank": { const it=run.items[run.i]; it.resp=null; it.checked=true; render(); break; }
    case "next": next(); break;
    case "enext": if(run.i<run.items.length-1){ run.i++; render(); window.scrollTo({top:0}); } break;
    case "prev": if(run.i>0){ run.i--; render(); window.scrollTo({top:0}); } break;
    case "go": run.i=+v; render(); break;
    case "finish": {
      const left = run.items.filter(it=>grade(it)==="blank").length;
      if(run.mode==="exam" && !confirm(left?`Te quedan ${left} sin responder (contarán en blanco). ¿Terminar?`:"¿Terminar y corregir?")) break;
      finish(); break;
    }
  }
}
app.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.tagName==="INPUT") return;
  act(b.dataset.act, b.dataset.v);
});
app.addEventListener("change", e=>{
  const t=e.target;
  if(t.matches('input[type="checkbox"][data-act]')) act(t.dataset.act);
  if(t.matches("select[data-row]")){
    const it=run.items[run.i]; if(!it.resp) it.resp=it.q.p.map(()=>-1);
    it.resp[+t.dataset.row]=+t.value;
  }
});
app.addEventListener("input", e=>{ if(e.target.id==="txt") run.items[run.i].resp=e.target.value; });
document.addEventListener("keydown", e=>{
  if(view!=="q" || !run || run.finished || e.metaKey || e.ctrlKey || e.altKey) return;
  const it=run.items[run.i], inst=run.mode==="inst";
  const tag=e.target.tagName;
  if(tag==="INPUT"||tag==="SELECT"){
    if(e.key==="Enter" && e.target.id==="txt"){ e.preventDefault(); if(inst) check(); else act(run.i<run.items.length-1?"enext":"finish"); }
    return;
  }
  if(tag==="BUTTON" && e.key==="Enter") return; // el botón con foco ya lo gestiona
  const k=e.key.toLowerCase();
  let idx="abcde".indexOf(k); if(idx<0 && /^[1-5]$/.test(k)) idx=+k-1;
  if(idx>=0 && k.length===1 && (it.q.t==="mc"||it.q.t==="multi") && it.ord[idx]!==undefined && !(inst&&it.checked)){ act("pick", it.ord[idx]); return; }
  if(e.key==="Enter"){
    e.preventDefault();
    if(inst){ if(it.checked) next(); else if(it.q.t!=="mc") check(); }
    else act(run.i<run.items.length-1?"enext":"finish");
  }
  if(!inst && e.key==="ArrowRight") act("enext");
  if(!inst && e.key==="ArrowLeft") act("prev");
});

render();
</script>
</body>
</html>
