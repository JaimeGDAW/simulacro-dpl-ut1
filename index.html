<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Test interactivo de Despliegue de Aplicaciones Web (DAW) - UT1, con penalización de 3 fallos = -1 acierto.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Simulacro DPL UT1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column (max 780px); each question sits under a terminal-style status strip */
:root{
  --bg:#edf2f3; --surface:#ffffff; --surface-2:#f5f8f9; --ink:#14222a; --muted:#56676f; --line:#d2dcdf;
  --accent:#0b6a6a; --accent-soft:#d8ebe9; --accent-ink:#ffffff;
  --ok:#1b7745; --ok-soft:#dcf0e3; --bad:#b0392d; --bad-soft:#f7e0dc; --blank:#86620f; --blank-soft:#f4ead0;
  --code:#e4ecee; --shadow:0 1px 2px rgba(20,34,42,.06),0 4px 14px rgba(20,34,42,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1518; --surface:#141f24; --surface-2:#19262c; --ink:#e1e9eb; --muted:#93a5ac; --line:#26363d;
    --accent:#47b9af; --accent-soft:#163331; --accent-ink:#04201e;
    --ok:#56c98e; --ok-soft:#133023; --bad:#f17b6f; --bad-soft:#3a1d1a; --blank:#e3b650; --blank-soft:#33290f;
    --code:#1c2a30; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#141f24; --surface-2:#19262c; --ink:#e1e9eb; --muted:#93a5ac; --line:#26363d;
  --accent:#47b9af; --accent-soft:#163331; --accent-ink:#04201e;
  --ok:#56c98e; --ok-soft:#133023; --bad:#f17b6f; --bad-soft:#3a1d1a; --blank:#e3b650; --blank-soft:#33290f;
  --code:#1c2a30; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
pre{margin:.6em 0 .2em;background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}

/* header */
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,5.5vw,2.6rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .slash{color:var(--accent)}
.sub{color:var(--muted);margin:0;max-width:62ch}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;letter-spacing:-.01em}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.hint{font-size:.88rem;color:var(--muted);margin:0}

/* scoring rule */
.rule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rule div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rule b{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.rule span{font-size:.85rem;color:var(--muted)}
.rule .r-ok b{color:var(--ok)} .rule .r-bad b{color:var(--bad)} .rule .r-bl b{color:var(--blank)}
.ev{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.ev strong{color:var(--ink)}

/* segmented + chips */
.seg,.chips{position:relative}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg input,.chips input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);cursor:pointer;min-width:0}
.seg label b{font-weight:700}
.seg label span{font-size:.82rem;color:var(--muted)}
.seg input:checked+label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:focus-visible+label,.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.seg input:disabled+label{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface-2);cursor:pointer;font-size:.9rem}
.chips label small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chips input:checked+label{border-color:var(--accent);background:var(--accent-soft)}
.chips input:checked+label::before{content:"✓";color:var(--accent);font-weight:700}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--accent);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:14px 22px;font-size:1.05rem}
.spacer{flex:1}

/* quiz */
.status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-bottom:8px}
.status .prompt{color:var(--accent);font-weight:600}
.status .ce{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--surface)}
.status .net{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.qtext{font-size:1.12rem;line-height:1.5;margin:0 0 16px;font-weight:700}
.qtext pre{font-weight:400}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--surface)}
.opt .txt{min-width:0;padding-top:2px}
.opt.is-sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.6}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback.bl{border-color:var(--blank);background:var(--blank-soft)}
.feedback b{display:block;margin-bottom:2px}
.feedback p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.keys{font-size:.78rem;color:var(--muted);margin-top:12px;font-family:var(--f-mono)}
.confirm{margin-top:14px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1 1 220px}
details.map{margin-top:16px}
details.map summary{cursor:pointer;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid button{height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.nota{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,13vw,4.6rem);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nota small{font-size:.35em;color:var(--muted);font-weight:500;letter-spacing:0}
.verdict{font-family:var(--f-mono);font-size:.82rem;display:inline-block;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.tally{display:flex;flex-wrap:wrap;gap:4px 16px;font-variant-numeric:tabular-nums}
.tally span b{font-family:var(--f-mono)}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-bl{color:var(--blank)}
.topics{width:100%;border-collapse:collapse;font-size:.9rem}
.topics th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.topics td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.topics td.num{font-family:var(--f-mono);white-space:nowrap;text-align:right}
.tbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);min-width:80px}
.tbar i{display:block;height:100%}
.tbar .o{background:var(--ok)} .tbar .b{background:var(--bad)} .tbar .w{background:var(--blank)}
.tablewrap{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.rv.k-ok{border-left-color:var(--ok)} .rv.k-bad{border-left-color:var(--bad)} .rv.k-bl{border-left-color:var(--blank)}
.rv-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-bottom:6px}
.rv-h .tag{border-radius:5px;padding:1px 7px;font-weight:600}
.k-ok .tag{background:var(--ok-soft);color:var(--ok)} .k-bad .tag{background:var(--bad-soft);color:var(--bad)} .k-bl .tag{background:var(--blank-soft);color:var(--blank)}
.rv-q{font-weight:700;margin:0 0 8px}
.rv-a{margin:0;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.rv-a .mine{color:var(--bad)}
.rv-a .right{color:var(--ok)}
.rv-e{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:0;font-size:.88rem}
.hist div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist div:last-child{border-bottom:0}
.hist .n{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.empty{color:var(--muted);font-size:.9rem;margin:0}
@media (max-width:560px){
  .seg{grid-template-columns:1fr}
  .rule b{font-size:1.05rem}
  .score{grid-template-columns:1fr;gap:8px}
  .qcard{padding:16px}
  .qtext{font-size:1.04rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">DPL · 2.º CFGS DAW · RA1 · CIFP Zonzamas</span>
    <h1>Simulacro <span class="slash">/</span> UT1</h1>
    <p class="sub">Implantación de arquitecturas web, prácticas de Telnet/SSH y HTTP/HTTPS, el viaje de un paquete y certificados digitales.</p>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<script>
var QB = []; var PATCH = {};
QB.push(
["arq","¿Qué diferencia hay entre desarrollar e implantar una aplicación?",["Desarrollar es construirla; implantar es conseguir que se ejecute correctamente en el entorno donde se va a usar","Son sinónimos: ambos consisten en escribir el código y sus pruebas","Implantar es únicamente copiar los ficheros al servidor por FTP","Implantar consiste en compilar el código sin errores en el portátil"],"Desarrollo responde a «¿hace lo que debe?»; implantación, a «¿funciona aquí, para todos, y sé repetirlo?»."],
["arq","Una implantación profesional se considera reproducible cuando…",["otra persona, siguiendo la documentación o la automatización, puede reconstruir un entorno equivalente","funciona en el portátil del desarrollador y también en el servidor","solo la persona que la montó sabe qué tocar para que arranque","se ha probado al menos una vez desde el navegador"],"Si solo funciona porque «tú sabes qué tocar», no está implantada: está improvisada."],
["arq","Al copiar una API Node.js al servidor aparece `Error: Cannot find module 'express'`. ¿Qué tipo de fallo es?",["De implantación: no se instalaron las dependencias (`npm install` / `npm ci`) en el servidor","De programación: hay un error de sintaxis en `app.js`","De red: el puerto 3000 está cerrado en el cortafuegos","De Nginx: falta el bloque `location /` en el sitio"],"Es el ejemplo de Lucía: el código está bien, pero en el servidor nadie ejecutó `npm install`."],
["arq","¿Qué componente de una arquitectura web traduce `www.ejemplo.es` a una dirección IP?",["DNS","CDN","Balanceador de carga","Servidor de aplicaciones"],"El DNS resuelve nombres de dominio a direcciones IP."],
["arq","¿Cuál es la función de una CDN?",["Servir copias de los recursos desde ubicaciones cercanas al usuario","Traducir nombres de dominio a direcciones IP","Ejecutar la lógica de negocio de la API","Guardar la información de forma persistente"],"CDN: copias cercanas que aceleran la entrega de recursos."],
["arq","¿Qué hace el servidor de aplicaciones en una arquitectura web?",["Ejecuta la lógica de negocio y expone la API","Recibe el tráfico HTTPS y termina TLS","Traduce el dominio a una IP","Reparte el tráfico entre varios servidores"],"Node.js, PHP-FPM o Tomcat ejecutan el código del backend."],
["arq","En el modelo monolítico…",["toda la aplicación se construye y se despliega como una sola unidad","cada funcionalidad es un servicio independiente con su propia base de datos","el frontend consume una API REST que devuelve JSON","presentación, lógica y datos van obligatoriamente en máquinas distintas"],"Monolito = interfaz, lógica y acceso a datos en un único despliegue."],
["arq","¿Cuál es un inconveniente típico del monolito?",["Un cambio pequeño obliga a desplegarlo todo y es difícil escalar por partes","Es complicado de desarrollar y probar al principio","Obliga a versionar la API y gestionar CORS","Necesita un API gateway y monitorización distribuida"],"Al principio es sencillo, pero se actualiza y escala como un bloque."],
["arq","En una arquitectura de tres capas…",["presentación, lógica de negocio y datos están separadas y cada capa solo habla con la contigua","el cliente habla directamente con la base de datos","cada servicio tiene su propio despliegue y su propia base de datos","toda la aplicación se despliega como una sola unidad"],"Presentación → lógica → datos, con responsabilidades claras."],
["arq","¿Cuál es la principal ventaja del modelo cliente + API?",["La misma API puede servir a la web y a la app móvil","Elimina la necesidad de autenticación","Todo se despliega como una sola unidad","Elimina la necesidad de un servidor web"],"Dos clientes distintos consumen los mismos endpoints."],
["arq","Un inconveniente del modelo cliente + API es que…",["hay que versionar la API y cuidar CORS y la autenticación","un cambio pequeño obliga a desplegarlo todo","no puede devolver datos en JSON","cada capa solo puede hablar con la contigua"],"Al exponer una API a varios clientes hay que gestionar versiones, CORS y autenticación."],
["arq","¿Cuál es el principal inconveniente de los microservicios?",["Mucha complejidad operativa: redes, monitorización y fallos parciales","No se pueden escalar los servicios por separado","Obligan a desplegar toda la aplicación ante cualquier cambio","Solo admiten una única base de datos compartida"],"Ganas escalado independiente a cambio de complejidad de operación."],
["arq","En una arquitectura de microservicios, ¿qué pieza recibe las peticiones y las dirige al servicio adecuado?",["El API gateway","El hipervisor","El proceso master de Nginx","La base de datos de pedidos"],"El API gateway es la puerta de entrada hacia usuarios, pedidos, pagos, catálogo…"],
["arq","Una app de reservas del aula tendrá web y app móvil que usan los mismos datos. ¿Qué modelo es más razonable?",["Cliente + API","Web estática","Monolito sin API","Microservicios con una base de datos por servicio"],"Dos clientes distintos consumen los mismos datos."],
["arq","Web informativa de una academia de idiomas, poco tráfico y un solo desarrollador. ¿Qué modelo es razonable?",["Monolito o web estática","Microservicios","Cliente + API con API gateway","Tres capas con clúster de bases de datos"],"Montar microservicios para una web de cinco páginas es mala decisión."],
["arq","Una tienda online tiene picos de tráfico en rebajas, sobre todo en catálogo y pagos. ¿Qué modelo propone la unidad?",["Microservicios (o monolito modular) para escalar catálogo y pagos por separado","Web estática servida desde una CDN","Monolito clásico en una sola VM","Tres capas sin posibilidad de escalar"],"Necesitas escalar partes concretas; el precio es más complejidad operativa."],
["arq","Intranet de gestión de un ayuntamiento con datos sensibles. ¿Qué modelo encaja según los apuntes?",["Tres capas, porque separar los datos de la presentación facilita la seguridad","Web estática","Serverless sin base de datos","Microservicios, uno por concejalía"],"La separación en capas aísla los datos sensibles de la presentación."],
["arq","Según los apuntes, ¿cuál es la mejor arquitectura web?",["Ninguna en general: depende de requisitos, tamaño, equipo, presupuesto, seguridad y operación","Los microservicios, porque escalan mejor","El monolito, porque es más sencillo","Cliente + API, porque sirve a web y móvil"],"No hay una arquitectura «mejor»: se elige según el contexto."],
["arq","En el modelo cliente-servidor de HTTP, ¿quién inicia la conversación?",["Siempre el cliente, con una petición","Siempre el servidor, con una respuesta","Quien tenga el puerto más bajo","El servidor DNS"],"El cliente pide; el servidor contesta."],
["arq","¿Qué hace un balanceador de carga?",["Reparte el tráfico entre varios servidores","Traduce nombres de dominio a IP","Ejecuta la lógica de la aplicación","Guarda respuestas en la caché del navegador"],"Nginx también puede hacer de balanceador."],
["arq","Implantar, según la unidad, consiste en…",["preparar el entorno, instalar y configurar, poner en marcha, comprobar y documentar","escribir el código, sus pruebas y su interfaz","copiar los ficheros y esperar a que funcione","compilar el proyecto y subirlo a GitHub"],"Es la definición de la figura 2 de la UT1."],

function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");}
function clockText(){return run?"tiempo "+fmtTime(Math.round((Date.now()-run.t0)/1000)):"";}
function startClock(){stopClock();clockT=setInterval(()=>{const c=document.getElementById("clock");if(c&&run)c.textContent=clockText();},1000);}
function stopClock(){if(clockT){clearInterval(clockT);clockT=null;}}
function scrollTop(){try{window.scrollTo(0,0);}catch(e){}}
function keepInView(){const r=view.getBoundingClientRect();if(r.top<0)window.scrollTo(0,window.scrollY+r.top-12);}

function poolFor(mode){
  const set=new Set(cfg.topics);
  let p=BANK.filter(b=>set.has(b.t));
  if(mode==="review"){const f=new Set(store.fallos);p=p.filter(b=>f.has(b.id));}
  return p;
}
function tally(items){let a=0,f=0,bl=0;items.forEach(x=>{if(x.ans===0)a++;else if(x.ans===null)bl++;else f++;});return {a,f,bl};}
function mark(id,ok){const s=new Set(store.fallos);if(ok)s.delete(id);else s.add(id);store.fallos=[...s];save();}

/* ---------- home ---------- */
function segOpt(val,title,sub,dis){
  return `<input type="radio" name="mode" id="m-${val}" value="${val}" ${cfg.mode===val?"checked":""} ${dis?"disabled":""}><label for="m-${val}"><b>${title}</b><span>${sub}</span></label>`;
}
function chipN(n){return `<input type="radio" name="n" id="n-${n}" value="${n}" ${cfg.n===n?"checked":""}><label for="n-${n}">${n||"Todas"}</label>`;}
function chipT(t,c){return `<input type="checkbox" name="topic" id="t-${t.k}" value="${t.k}" ${cfg.topics.includes(t.k)?"checked":""}><label for="t-${t.k}" title="${esc(t.s)}">${esc(t.n)} <small>${c}</small></label>`;}
function startInfo(){
  const pool=poolFor(cfg.mode);
  const n=cfg.n===0?pool.length:Math.min(cfg.n,pool.length);
  let hint;
  if(!cfg.topics.length)hint="Elige al menos un tema.";
  else if(cfg.mode==="review")hint=pool.length?`${pool.length} fallos guardados en estos temas.`:"No tienes fallos guardados en estos temas.";
  else hint=`${pool.length} preguntas disponibles con esta selección.`;
  return {n,hint};
}
function histHTML(){
  if(!store.hist.length)return "";
  return `<section class="panel"><p class="label">Tus últimos intentos</p><div class="hist">${store.hist.map(h=>{
    const d=new Date(h.d);
    return `<div><span>${d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})} ${d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}</span><span>${ML[h.m]||""} · ${h.n} preg.</span><span class="hint">${h.a} ✓ ${h.f} ✗ ${h.b} ○</span><span class="n ${h.nota>=5?"c-ok":"c-bad"}">${n2(h.nota)}</span></div>`;
  }).join("")}</div><div class="actions" style="margin-top:6px"><button class="linkbtn" data-act="resetAll">Borrar historial y fallos guardados</button></div></section>`;
}
function renderHome(){
  stopClock(); run=null;
  const counts={}; BANK.forEach(b=>{counts[b.t]=(counts[b.t]||0)+1;});
  const fallosN=store.fallos.length;
  if(cfg.mode==="review"&&!fallosN)cfg.mode="practice";
  const si=startInfo();
  view.innerHTML=`
  <div class="stack">
    <section class="panel">
      <p class="label">Cómo puntúa tu examen</p>
      <div class="rule">
        <div class="r-ok"><b>+1</b><span>acierto</span></div>
        <div class="r-bad"><b>−⅓</b><span>fallo (3 fallos restan 1)</span></div>
        <div class="r-bl"><b>0</b><span>en blanco</span></div>
      </div>
      <p class="ev">Con 4 opciones, contestar <strong>totalmente al azar</strong> te deja en 0 de media. Si descartas <strong>una</strong> opción, responder ya suma (+0,11 por pregunta); si dudas entre <strong>dos</strong>, +0,33. Si no puedes descartar ninguna, déjala en blanco.</p>
    </section>
    <section class="panel stack">
      <div>
        <p class="label">Modo</p>
        <div class="seg">
          ${segOpt("practice","Corrección al momento","Bien/mal y explicación tras cada pregunta")}
          ${segOpt("exam","Simulacro de examen","Corrección al final, como el real")}
          ${segOpt("review","Repasar fallos",fallosN?fallosN+" preguntas guardadas":"Aún no tienes fallos guardados",!fallosN)}
        </div>
      </div>
      <div>
        <p class="label">Número de preguntas</p>
        <div class="chips">${[20,50,100,0].map(chipN).join("")}</div>
      </div>
      <div>
        <div class="row" style="justify-content:space-between">
          <p class="label" style="margin:0">Temas</p>
          <span><button class="linkbtn" data-act="allT">Todos</button><button class="linkbtn" data-act="noneT">Ninguno</button></span>
        </div>
        <div class="chips" style="margin-top:8px">${TOPICS.map(t=>chipT(t,counts[t.k]||0)).join("")}</div>
      </div>
      <div class="row">
        <button class="btn primary big" data-act="start" ${si.n?"":"disabled"}>${si.n?`Empezar · ${si.n} preguntas`:"Sin preguntas"}</button>
        <span class="hint" id="poolHint">${si.hint}</span>
      </div>
      <p class="hint">Banco de ${BANK.length} preguntas sacadas de tus cinco documentos. En cada intento se eligen al azar y se barajan las opciones.</p>
    </section>
    ${histHTML()}
  </div>`;
}
function updateStart(){
  const si=startInfo();
  const b=view.querySelector('[data-act="start"]'), h=document.getElementById("poolHint");
  if(b){b.disabled=!si.n;b.textContent=si.n?`Empezar · ${si.n} preguntas`:"Sin preguntas";}
  if(h)h.textContent=si.hint;
}

/* ---------- quiz ---------- */
function newRun(mode,ids){
  run={mode,items:ids.map(id=>({id,order:shuffle([0,1,2,3]),ans:null,done:false})),i:0,t0:Date.now(),confirm:null,mapOpen:false};
  res=null; renderQuiz(); startClock(); scrollTop();
}
function start(){
  const pool=poolFor(cfg.mode); if(!pool.length)return;
  const n=cfg.n===0?pool.length:Math.min(cfg.n,pool.length);
  newRun(cfg.mode,shuffle(pool.map(b=>b.id)).slice(0,n));
}
function renderQuiz(){
  const it=run.items[run.i], b=BYID[it.id], N=run.items.length, practice=run.mode!=="exam", t=TMAP[b.t];
  const answered=run.items.filter(x=>practice?x.done:x.ans!==null).length;
  const locked=practice&&it.done, last=run.i===N-1, L="ABCD";
  let net="";
  if(practice){const s=tally(run.items.filter(x=>x.done));net=`<span class="net"><span class="c-ok">✓ ${s.a}</span> · <span class="c-bad">✗ ${s.f}</span> · <span class="c-bl">○ ${s.bl}</span> · netos ${n2(s.a-s.f/3)}</span>`;}
  const opts=it.order.map((oi,pos)=>{
    let c="opt";
    if(locked)c+=oi===0?" is-ok":(it.ans===oi?" is-bad":" is-dim");
    else if(it.ans===oi)c+=" is-sel";
    return `<button class="${c}" data-act="pick" data-oi="${oi}" ${locked?"disabled":""} aria-pressed="${it.ans===oi}"><span class="key">${L[pos]}</span><span class="txt">${inl(b.o[oi])}</span></button>`;
  }).join("");
  let fb="";
  if(locked){
    if(it.ans===0)fb=`<div class="feedback ok"><b>Correcta · +1</b><p>${inl(b.e)}</p></div>`;
    else if(it.ans===null)fb=`<div class="feedback bl"><b>En blanco · 0</b><p>La correcta era: <strong>${inl(b.o[0])}</strong>. ${inl(b.e)}</p></div>`;
    else fb=`<div class="feedback bad"><b>Fallo · −⅓</b><p>La correcta era: <strong>${inl(b.o[0])}</strong>. ${inl(b.e)}</p></div>`;
  }
  let actions;
  if(practice){
    actions=locked?`<button class="btn primary" data-act="next">${last?"Ver resultado":"Siguiente →"}</button>`:`<button class="btn" data-act="skip">No la sé (en blanco)</button>`;
    actions+=`<span class="spacer"></span><button class="btn ghost" data-act="askFinish">Terminar</button>`;
  }else{
    actions=`<button class="btn" data-act="prev" ${run.i===0?"disabled":""}>← Anterior</button>
      <button class="btn" data-act="clear" ${it.ans===null?"disabled":""}>Dejar en blanco</button>
      <button class="btn primary" data-act="next" ${last?"disabled":""}>Siguiente →</button>
      <span class="spacer"></span><button class="btn warn" data-act="askFinish">Entregar</button>`;
  }
  let conf="";
  if(run.confirm==="finish"){
    const left=N-answered;
    const msg=practice?`Se corregirán las ${answered} preguntas que has respondido.`:(left?`Te quedan <b>${left}</b> sin contestar; contarán como en blanco.`:"Has contestado todas.");
    conf=`<div class="confirm"><p>${msg} ¿${practice?"Terminar":"Entregar"} ahora?</p><button class="btn warn" data-act="finish">${practice?"Terminar":"Entregar"}</button><button class="btn" data-act="cancel">Seguir</button></div>`;
  }else if(run.confirm==="quit"){
    conf=`<div class="confirm"><p>Si sales ahora, este intento no se guarda.</p><button class="btn warn" data-act="home">Salir</button><button class="btn" data-act="cancel">Seguir</button></div>`;
  }
  const map=practice?"":`<details class="map" ${run.mapOpen?"open":""}><summary>Mapa de preguntas · ${answered}/${N} contestadas</summary><div class="grid">${run.items.map((x,k)=>`<button data-act="go" data-k="${k}" class="${x.ans!==null?"done":""} ${k===run.i?"cur":""}" aria-label="Pregunta ${k+1}">${k+1}</button>`).join("")}</div></details>`;
  view.innerHTML=`
    <div class="status"><span class="prompt">$ pregunta ${run.i+1}/${N}</span><span class="ce" title="${esc(t.s)}">${esc(t.n)}</span><span id="clock">${clockText()}</span>${net}<span class="spacer"></span><button class="linkbtn" data-act="quit">Salir</button></div>
    <div class="bar"><i style="width:${(answered/N*100).toFixed(1)}%"></i></div>
    <article class="qcard">
      <div class="qtext">${fmt(b.q)}</div>
      <div class="opts">${opts}</div>
      ${fb}
      <div class="actions">${actions}</div>
      ${conf}
      <p class="keys">Teclado: A–D o 1–4 responder · ${practice?"Enter siguiente · 0 no la sé":"← → moverse · 0 dejar en blanco"}</p>
    </article>
    ${map}`;
}
function pick(oi){
  const it=run.items[run.i];
  if(run.mode==="exam"){it.ans=it.ans===oi?null:oi;renderQuiz();return;}
  if(it.done)return;
  it.ans=oi;it.done=true;mark(it.id,oi===0);renderQuiz();
}
function skip(){const it=run.items[run.i];if(it.done)return;it.ans=null;it.done=true;mark(it.id,false);renderQuiz();}
function go(k){if(k<0||k>=run.items.length)return;run.i=k;run.confirm=null;renderQuiz();keepInView();}
function next(){
  if(run.mode!=="exam"&&!run.items[run.i].done)return;
  if(run.i<run.items.length-1)go(run.i+1);
  else if(run.mode!=="exam")finish();
}

/* ---------- results ---------- */
function finish(){
  stopClock();
  const practice=run.mode!=="exam";
  const items=practice?run.items.filter(x=>x.done):run.items;
  if(!items.length){renderHome();scrollTop();return;}
  if(!practice)items.forEach(x=>mark(x.id,x.ans===0));
  const s=tally(items), N=items.length, net=s.a-s.f/3, nota=Math.max(0,net)/N*10;
  const secs=Math.round((Date.now()-run.t0)/1000);
  store.hist.unshift({d:Date.now(),m:run.mode,n:N,a:s.a,f:s.f,b:s.bl,nota:Math.round(nota*100)/100});
  store.hist=store.hist.slice(0,8); save();
  res={mode:run.mode,items,N,a:s.a,f:s.f,bl:s.bl,net,nota,secs,filter:"wrongbl",wrongIds:items.filter(x=>x.ans!==0).map(x=>x.id)};
  run=null; renderResults(); scrollTop();
}
function reviewItem(x,k){
  const b=BYID[x.id], kind=x.ans===0?"ok":x.ans===null?"bl":"bad";
  const tag={ok:"Acierto +1",bad:"Fallo −⅓",bl:"En blanco 0"}[kind];
  return `<article class="rv k-${kind}">
    <div class="rv-h"><span>#${k+1}</span><span>${esc(TMAP[b.t].n)}</span><span class="tag">${tag}</span></div>
    <div class="rv-q">${fmt(b.q)}</div>
    <div class="rv-a">${kind==="bad"?`<span class="mine">✗ Tu respuesta: ${inl(b.o[x.ans])}</span>`:""}${kind==="bl"?`<span class="c-bl">○ Sin responder</span>`:""}<span class="right">✓ Correcta: ${inl(b.o[0])}</span></div>
    <p class="rv-e">${inl(b.e)}</p>
  </article>`;
}
function renderResults(){
  const pass=res.nota>=5, f=res.filter;
  const per={};
  res.items.forEach(x=>{const t=BYID[x.id].t;const p=per[t]||(per[t]={a:0,f:0,bl:0,n:0});p.n++;if(x.ans===0)p.a++;else if(x.ans===null)p.bl++;else p.f++;});
  const rows=TOPICS.filter(t=>per[t.k]).map(t=>{
    const p=per[t.k], w=v=>(v/p.n*100).toFixed(1)+"%";
    return `<tr><td>${esc(t.n)}<br><small class="hint">${esc(t.s)}</small></td><td class="num"><span class="c-ok">${p.a}</span> · <span class="c-bad">${p.f}</span> · <span class="c-bl">${p.bl}</span></td><td class="num">${n2(p.a-p.f/3)} / ${p.n}</td><td style="width:32%"><div class="tbar" role="img" aria-label="${p.a} aciertos, ${p.f} fallos, ${p.bl} en blanco"><i class="o" style="width:${w(p.a)}"></i><i class="b" style="width:${w(p.f)}"></i><i class="w" style="width:${w(p.bl)}"></i></div></td></tr>`;
  }).join("");
  const keep=x=>f==="all"?true:f==="wrong"?(x.ans!==null&&x.ans!==0):f==="blank"?x.ans===null:x.ans!==0;
  const list=res.items.map((x,k)=>({x,k})).filter(o=>keep(o.x)).map(o=>reviewItem(o.x,o.k)).join("")||`<p class="empty">Nada que mostrar con este filtro.</p>`;
  const fb=(v,l)=>`<button data-act="filter" data-f="${v}" aria-pressed="${f===v}">${l}</button>`;
  const ifBlank=res.f?`Si hubieras dejado en blanco los fallos, tendrías un ${n2(res.a/res.N*10)}.`:"";
  view.innerHTML=`
  <div class="stack">
    <section class="panel stack">
      <div class="score">
        <div class="nota">${n2(res.nota)}<small> /10</small></div>
        <div class="stack" style="gap:6px">
          <span><span class="verdict ${pass?"pass":"fail"}">${pass?"HTTP/1.1 200 OK · aprobado":"HTTP/1.1 503 · aún no está preparado"}</span></span>
          <div class="tally"><span><b class="c-ok">${res.a}</b> aciertos</span><span><b class="c-bad">${res.f}</b> fallos <small class="hint">(−${n2(res.f/3)})</small></span><span><b class="c-bl">${res.bl}</b> en blanco</span></div>
          <p class="hint">Puntos netos ${n2(res.net)} de ${res.N} · ${fmtTime(res.secs)} · ${ML[res.mode]}. ${ifBlank}</p>
        </div>
      </div>
      <div class="actions" style="margin-top:0">${res.wrongIds.length?`<button class="btn primary" data-act="retryWrong">Repasar estos ${res.wrongIds.length} fallos y blancos</button>`:""}<button class="btn" data-act="home">Nuevo intento</button></div>
    </section>
    <section class="panel stack">
      <h2>Por tema</h2>
      <div class="tablewrap"><table class="topics"><thead><tr><th>Tema</th><th style="text-align:right">✓ · ✗ · ○</th><th style="text-align:right">Netos</th><th>Reparto</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="stack">
      <div class="row" style="justify-content:space-between"><h2>Revisión</h2><div class="filters">${fb("wrongbl","Fallos y blancos")}${fb("wrong","Solo fallos")}${fb("blank","En blanco")}${fb("all","Todas")}</div></div>
      ${list}
    </section>
  </div>`;
}

/* ---------- events ---------- */
view.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||!view.contains(el))return;
  const act=el.dataset.act;
  switch(act){
    case "start":start();break;
    case "allT":cfg.topics=TOPICS.map(t=>t.k);saveCfg();renderHome();break;
    case "noneT":cfg.topics=[];saveCfg();renderHome();break;
    case "resetAll":
      if(!el.dataset.arm){el.dataset.arm="1";el.textContent="Pulsa otra vez para borrarlo todo";}
      else{store={fallos:[],hist:[],cfg2:cfg};save();renderHome();}
      break;
    case "pick":pick(+el.dataset.oi);break;
    case "skip":skip();break;
    case "next":next();break;
    case "prev":go(run.i-1);break;
    case "go":go(+el.dataset.k);break;
    case "clear":run.items[run.i].ans=null;renderQuiz();break;
    case "askFinish":run.confirm="finish";renderQuiz();break;
    case "quit":run.confirm="quit";renderQuiz();break;
    case "cancel":run.confirm=null;renderQuiz();break;
    case "finish":finish();break;
    case "home":renderHome();scrollTop();break;
    case "filter":res.filter=el.dataset.f;renderResults();break;
    case "retryWrong":newRun("review",shuffle(res.wrongIds.slice()));break;
  }
});
view.addEventListener("change",e=>{
  const t=e.target; if(!t.name)return;
  if(t.name==="mode")cfg.mode=t.value;
  else if(t.name==="n")cfg.n=+t.value;
  else if(t.name==="topic"){const s=new Set(cfg.topics);if(t.checked)s.add(t.value);else s.delete(t.value);cfg.topics=TOPICS.map(x=>x.k).filter(k=>s.has(k));}
  saveCfg(); updateStart();
});
view.addEventListener("toggle",e=>{if(run&&e.target.matches&&e.target.matches("details.map"))run.mapOpen=e.target.open;},true);
document.addEventListener("keydown",e=>{
  if(!run||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea")return;
  const k=(e.key||"").toLowerCase();
  if(k.length===1){
    let idx="abcd".indexOf(k); if(idx<0)idx="1234".indexOf(k);
    if(idx>=0){pick(run.items[run.i].order[idx]);e.preventDefault();return;}
    if(k==="0"){if(run.mode==="exam"){run.items[run.i].ans=null;renderQuiz();}else skip();e.preventDefault();return;}
  }
  if(k==="arrowright"){if(run.mode==="exam")go(run.i+1);else next();e.preventDefault();}
  else if(k==="arrowleft"&&run.mode==="exam"){go(run.i-1);e.preventDefault();}
  else if(k==="enter"){if(e.target.closest&&e.target.closest("button,summary"))return;next();e.preventDefault();}
});

renderHome();
})();
</script>
</body>
</html>
